spring.application.name=quizappdemo

server.port=5000

spring.datasource.url=jdbc:mysql://localhost:3306/quiz_project
spring.datasource.username=besdproject
spring.datasource.password=besdproject
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.jackson.time-zone=Europe/Istanbul

spring.main.banner-mode=off
logging.level.root=warn